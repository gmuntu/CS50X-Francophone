# Lancement sur le serveur : docker compose up -d --build
# Limites fixes : le service ne peut jamais prendre la place des autres applications.
services:
  verification-voix:
    build: .
    container_name: savoiria-verification-voix
    restart: unless-stopped
    env_file: .env            # contient CLE_SERVICE (jamais envoyé sur GitHub)
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8770:8770"   # visible seulement depuis le serveur lui-même
